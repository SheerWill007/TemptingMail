version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/backend', '/frontend']
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directories: ['/backend', '/frontend']
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
