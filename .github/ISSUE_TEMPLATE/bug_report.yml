name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not report security vulnerabilities here**; use Security → Report a vulnerability instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Send an email to ...
        3. See error
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request ID
      description: From the `X-Request-Id` response header or the error's `requestId`, if available.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v2.1.0 or commit SHA
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Vercel + VPS
        - Local development
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any email addresses or message content first.
      render: shell
