name: Release

# Push a tag like v2.1.0 to publish versioned images to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>-backend:2.1.0  and  ghcr.io/<owner>/<repo>-frontend:2.1.0
# The frontend bakes in NEXT_PUBLIC_* values at build time; set them as repository variables
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MAIL_DOMAIN=${{ vars.NEXT_PUBLIC_MAIL_DOMAIN }}
            NEXT_PUBLIC_SOURCE_URL=${{ vars.NEXT_PUBLIC_SOURCE_URL || format('{0}/{1}', github.server_url, github.repository) }}

  github-release:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
